name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q app.py core script_builders ui_web
      - name: Run configuration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  windows-packaging-preflight:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
      - name: Parse PowerShell source
        shell: powershell
        run: |
          $parseErrors = @()
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors) {
              $parseErrors += $errors
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }
      - name: Check packaging prerequisites without optional build tools
        shell: cmd
        run: packaging\build-package.cmd -PreflightOnly -SkipHotkeyHelper -SkipInstaller
